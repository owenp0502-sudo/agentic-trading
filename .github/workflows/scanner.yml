name: TJR SMC Scanner

# Every 5 minutes during the NY Open window (9:30–11:00 AM Eastern),
# Monday–Friday. Timezone is declared explicitly; the cron runs in that
# zone (fall back to '*/5 13-14 * * 1-5' UTC if your Actions runner
# predates timezone support).
#
# Pipeline (all $0, no Render): scanner computes the signal in-process,
# executor.py re-verifies the 10% cap against the live Robinhood account,
# then Gemini + Robinhood MCP place the order. Discord alerts every outcome.
on:
  workflow_dispatch:
    inputs:
      selftest:
        description: "Synthetic end-to-end selftest (no session gate)"
        type: boolean
        default: false
      flatten:
        description: "Flatten all positions + cancel resting orders (no scan)"
        type: boolean
        default: false
  schedule:
    - cron: '*/5 9-10 * * 1-5'
      timezone: "America/New_York"
    # 11:00 AM close-out run
    - cron: '0 11 * * 1-5'
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: tjr-scanner
  cancel-in-progress: false   # never kill a scan mid-run

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner (or selftest drill)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          ROBINHOOD_TOKEN_STORE_JSON: ${{ secrets.ROBINHOOD_TOKEN_STORE_JSON }}
          ALPACA_PAPER: "paper"
          EXECUTOR_DRY_RUN: "1"
          SCANNER_SELFTEST: ${{ inputs.selftest }}
          SCANNER_FLATTEN: ${{ inputs.flatten }}
        run: |
          if [ "$SCANNER_FLATTEN" = "true" ] || [ "$SCANNER_FLATTEN" = "1" ]; then
            python scanner.py --flatten
          elif [ "$SCANNER_SELFTEST" = "true" ] || [ "$SCANNER_SELFTEST" = "1" ]; then
            python scanner.py --selftest
          else
            python scanner.py
          fi
